name: CI/CD Pipeline - Docker & Railway

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  # ===================================================
  # 1. Compilación y publicación de la imagen Docker
  # ===================================================
  build-and-push-docker:
    name: Build & Push Docker Image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticación en GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generar metadatos y etiquetas para la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Compilar y publicar imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_PUSHER_KEY=${{ secrets.NEXT_PUBLIC_PUSHER_KEY }}
            NEXT_PUBLIC_PUSHER_CLUSTER=${{ secrets.NEXT_PUBLIC_PUSHER_CLUSTER }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===================================================
  # 2. Despliegue automático a producción en Railway
  # ===================================================
  deploy-to-railway:
    name: Deploy Container to Railway
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Railway CLI
        run: npm install -g @railway/cli

      - name: Desplegar en Railway
        run: |
          SERVICE_NAME="${{ secrets.RAILWAY_SERVICE_NAME || vars.RAILWAY_SERVICE_NAME || 'interlocapp' }}"
          echo "Desplegando en el servicio de Railway: $SERVICE_NAME"
          railway up --service "$SERVICE_NAME" --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
